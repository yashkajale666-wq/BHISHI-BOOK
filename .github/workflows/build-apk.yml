name: Build BhishiBook APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q BhishiBook_full_source.zip -d project

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find project -maxdepth 4 -name "settings.gradle" -o -name "settings.gradle.kts" -print

      - name: Build APK
        run: |
          ROOT=$(find project -maxdepth 4 -type f -name "settings.gradle" -o -name "settings.gradle.kts" -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android Gradle project not found!"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Android project found at: $ROOT"
          cd "$ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no
